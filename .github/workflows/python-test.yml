
# This workflow will install Python dependencies, lint with ruff and run tests

name: Test and lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade ruff pytest coverage
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with ruff
      run: |
        ruff check . --output-format=github
    - name: Check formatting with ruff
      run: |
        ruff format --check .
    - name: Run pytest
      run: |
        coverage run -m pytest
      env:
        API_KEY: ${{secrets.API_KEY}}
        API_SECRET_KEY: ${{secrets.API_SECRET_KEY}}
        ACCESS_TOKEN: ${{secrets.ACCESS_TOKEN}}
        ACCESS_TOKEN_SECRET: ${{secrets.ACCESS_TOKEN_SECRET}}
        CONTEXT_API: ${{secrets.CONTEXT_API}}
        CONTEXT_API_SECRET: ${{secrets.CONTEXT_API_SECRET}}
        CONTEXT_ACCESS: ${{secrets.CONTEXT_ACCESS}}
        CONTEXT_ACCESS_SECRET: ${{secrets.CONTEXT_ACCESS_SECRET}}
        TEST_API: ${{secrets.TEST_API}}
        TEST_API_SECRET: ${{secrets.TEST_API_SECRET}}
        TEST_ACCESS: ${{secrets.TEST_ACCESS}}
        TEST_ACCESS_SECRET: ${{secrets.TEST_ACCESS_SECRET}}
        SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
    - name: Upload coverage report
      run: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov